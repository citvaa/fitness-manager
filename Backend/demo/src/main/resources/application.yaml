spring:
  profiles:
    active: dev

  application:
    name: fitness-manager

  flyway:
    enabled: true
    locations: classpath:db/migration

  datasource:
    url: jdbc:postgresql://localhost:8877/fm
    username: fm_dbuser
    password: password

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      org:
        hibernate:
          envers:
            default_schema: public
            audit_table_suffix: _AUD
            revision_field_name: REV
            revision_type_field_name: REVTYPE
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      password: password

  cache:
    type: redis

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
  config: classpath:logback-spring.xml

server:
  port: 8088
  servlet:
    context-path: /

app:
  registration-key-validity-minutes: 10
  reset-key-validity-minutes: 10

  # Frontend origin(s) allowed to call this API with credentials (see
  # config.web.CorsConfig). Change to the real frontend domain in production.
  cors:
    allowed-origins: http://localhost:5173

  email:
    activation-template: email/activation-email.html
    reset-password-template: email/reset-password-email.html

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 900000
    refreshTokenExpiration: 7200000

  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-4-5-20251001
    max-tokens: 500

  occupancy:
    broadcast-rate-ms: 60000
