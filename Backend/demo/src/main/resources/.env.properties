# Configuration for the me.paulschwarz:spring-dotenv dependency (see pom.xml).
# This file is NOT the .env file itself - it only tells spring-dotenv where to
# find it. The repo's .env lives at the repository root, two directories above
# this module (Backend/demo), so "directory" points there. This file is
# committed (it contains no secrets); the actual .env stays git-ignored.
directory=../..
